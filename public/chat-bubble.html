<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Bubble Widget - Preview</title>
</head>
<body>
  <script src="/env-config.js"></script>
  <script src="/chatbot-widget.js"></script>
  <script>
    (function() {
      var botId = new URLSearchParams(window.location.search).get('botId');
      if (!botId) {
        console.error('Bot ID is required');
        document.body.innerHTML = '<div style="padding: 40px; text-align: center; font-family: sans-serif;"><h1>Error</h1><p>Bot ID is required. Please use: chat-bubble.html?botId=YOUR_BOT_ID</p></div>';
        return;
      }

      var env = window.__ENV_CONFIG__ || {};
      ChatbotWidget.init({
        botId: botId,
        origin: window.location.origin,
        supabaseUrl: env.SUPABASE_URL,
        supabaseAnonKey: env.SUPABASE_ANON_KEY
      });
    })();
  </script>
</body>
</html>
